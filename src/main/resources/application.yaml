spring:
  profiles.active: ${SPRING_ACTIVE_PROFILE:dev}
  application:
    name: ${SPRING_APP_NAME:api-gateway}

  threads:
    virtual:
      enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/company-platform}

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 5s
          default-filters:
            - RemoveRequestHeader=Cookie
            - RemoveRequestHeader=X-User-Id
            - RemoveRequestHeader=X-Forwarded-User
            - RemoveRequestHeader=X-Internal-User
          routes:
            - id: reviews-service-api
              uri: ${REVIEWS_SERVICE_URI:http://localhost:9171}
              predicates:
                - Path=/api/v1/reviews,/api/v1/reviews/**

            - id: user-service-health
              uri: ${USER_SERVICE_URI:lb://user-service}
              predicates:
                - Path=/api/users/ping
                - Method=GET

            - id: user-service-api
              uri: ${USER_SERVICE_URI:lb://user-service}
              predicates:
                - Path=/api/users/**
              filters:
                - PreserveHostHeader

            - id: user-service-openapi
              uri: ${USER_SERVICE_URI:lb://user-service}
              predicates:
                - Path=/user-service/v3/api-docs,/user-service/api-docs,/user-service/swagger-ui/**
              filters:
                - RewritePath=/user-service/(?<segment>.*), /${segment}

            - id: auth-service-api
              uri: ${AUTH_SERVICE_URI:lb://auth-service}
              predicates:
                - Path=/api/roles/**,/api/permissions/**
              filters:
                - PreserveHostHeader

            - id: auth-service-openapi
              uri: ${AUTH_SERVICE_URI:lb://auth-service}
              predicates:
                - Path=/auth-service/v3/api-docs,/auth-service/api-docs,/auth-service/swagger-ui/**
              filters:
                - RewritePath=/auth-service/(?<segment>.*), /${segment}

server:
  port: ${SERVER_PORT:9211}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE:http://localhost:9111/eureka}

logging:
  level:
    root: ${ROOT_LOG_LEVEL:info}
    org.springframework.security: ${SPRING_SECURITY_LOG_LEVEL:info}
    org.springframework.cloud.gateway: ${SPRING_CLOUD_GATEWAY_LOG_LEVEL:info}
  pattern:
    level: ${LOG_PATTERN_CONSOLE:%green(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %blue(-%5level) %red([%thread]) %magenta(---){faint} %yellow(%logger{15}) - %msg%n}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,prometheus,loggers,threaddump
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
  info:
    env:
      enabled: true
    build:
      enabled: true
    git:
      enabled: true
      mode: full
    java:
      enabled: true
    os:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: "Keycloak-secured API gateway"
